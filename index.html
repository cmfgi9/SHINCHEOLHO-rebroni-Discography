<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHINCHEOLHO-rebroni | Discography</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <h1>SHINCHEOLHO-rebroni</h1>
  <p>Official Discography · Rebroni Music</p>
</header>

<!-- Top-left quick menu -->
<button id="quick-menu-btn" class="quick-menu-btn" type="button" aria-label="Open album quick menu">
  Albums
</button>

<div id="quick-menu" class="quick-menu" aria-hidden="true">
  <div class="quick-menu-header">
    <div class="quick-menu-title">Go to album</div>
    <button id="quick-menu-close" class="quick-menu-close" type="button" aria-label="Close album quick menu">×</button>
  </div>
  <div id="quick-menu-links" class="quick-menu-links"></div>
</div>

<div id="quick-menu-backdrop" class="quick-menu-backdrop" aria-hidden="true"></div>

<nav id="album-nav" class="album-nav"></nav>

<div class="toolbar">
  <input id="search" placeholder="Search track title or ISRC">
</div>

<main id="albums"></main>

<footer>© Rebroni Music · SHINCHEOLHO-rebroni</footer>

<script src="app.js"></script>
</body>
</html>
