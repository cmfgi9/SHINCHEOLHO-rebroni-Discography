<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHINCHEOLHO-rebroni | Discography</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="hero">
    <h1>SHINCHEOLHO-rebroni</h1>
    <p>Official Discography · Rebroni Music</p>
  </header>

  <!-- Sticky navigation -->
  <div class="stickybar" id="stickybar">
    <button class="iconbtn" id="quick-menu-btn" type="button" aria-label="Open albums menu">Albums</button>

    <nav id="album-nav" class="album-nav" aria-label="Album navigation"></nav>

    <div class="search-wrap">
      <input id="search" placeholder="Search track title or ISRC" />
    </div>
  </div>

  <!-- Quick menu drawer -->
  <div id="quick-menu-backdrop" class="backdrop" aria-hidden="true"></div>
  <aside id="quick-menu" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">Albums</div>
      <button class="iconbtn iconbtn-close" id="quick-menu-close" type="button" aria-label="Close albums menu">×</button>
    </div>
    <div class="drawer-sub">Go to album</div>
    <nav id="quick-menu-links" class="drawer-links" aria-label="Albums list"></nav>
  </aside>

  <main id="albums"></main>

  <footer>© Rebroni Music · SHINCHEOLHO-rebroni</footer>

  <script src="app.js"></script>
</body>
</html>
