<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos | SHINCHEOLHO-rebroni · Rebroni Music</title>
  <meta name="description" content="SHINCHEOLHO-rebroni의 유튜브 영상 모음 — 앨범곡, 미발매곡, Shorts">
  <meta property="og:title" content="Videos | SHINCHEOLHO-rebroni">
  <meta property="og:description" content="앨범곡 · 미발매곡 · Shorts 영상 모음">
  <meta property="og:image" content="https://music.rebroni.com/ep1-beyondgoldengate.jpg">
  <meta property="og:url" content="https://music.rebroni.com/videos.html">
  <!-- 사이트와 같은 테마(dark / nature)를 CSS 로드 전에 적용 -->
  <script>
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark"); }
    catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  </script>
  <style>
    :root {
      --bg: #0e0e11;
      --fg: #f5f5f7;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, .12);
      --panel: rgba(255, 255, 255, .04);
      --chip: rgba(255, 255, 255, .07);
      --accent: #7dd3fc;
      --modal: #16161b;
    }

    [data-theme="nature"] {
      --bg: #f3f7f1;
      --fg: #1d2b21;
      --muted: #55685a;
      --line: rgba(24, 68, 40, .18);
      --panel: rgba(255, 255, 255, .7);
      --chip: rgba(34, 96, 56, .08);
      --accent: #2f7a4b;
      --modal: #f8fbf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      padding: 32px 16px 48px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover { color: var(--fg); }

    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    h1 { font-size: 28px; margin: 0 0 6px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 15px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 22px;
    }

    .chip {
      font: inherit;
      font-size: 13px;
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--fg);
      cursor: pointer;
    }

    .chip.on { border-color: var(--accent); color: var(--accent); }
    .toolbar .spacer { flex: 1; }

    .toolbar select, .toolbar input {
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--fg);
      max-width: 100%;
    }

    .toolbar input { width: 200px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px 18px;
    }

    .card {
      all: unset;
      display: block;
      cursor: pointer;
      border-radius: 12px;
    }

    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #000 center / cover no-repeat;
      border: 1px solid var(--line);
      transition: transform .15s ease;
    }

    .card:hover .thumb { transform: translateY(-2px); }

    .thumb .badge {
      position: absolute;
      left: 8px;
      top: 8px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .7);
      color: #fff;
    }

    .thumb .badge.short { left: auto; right: 8px; background: #ff0033; }

    .thumb .play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 38px;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 51, .9);
      border-radius: 10px;
      opacity: 0;
      transition: opacity .15s ease;
    }

    .thumb .play::after {
      content: "";
      position: absolute;
      left: 21px;
      top: 11px;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #fff;
    }

    .card:hover .play, .card:focus-visible .play { opacity: 1; }

    .card h2 {
      font-size: 15px;
      line-height: 1.4;
      margin: 10px 2px 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card .meta { font-size: 12.5px; color: var(--muted); margin: 0 2px; }

    .empty { color: var(--muted); text-align: center; padding: 48px 0; }

    /* 재생 창 */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, .78);
    }

    .modal[hidden] { display: none; }

    .modal-panel {
      position: relative;
      width: min(960px, 100%);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--modal);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .modal-panel.short { width: min(420px, 100%); }

    .player { aspect-ratio: 16 / 9; background: #000; }
    .modal-panel.short .player { aspect-ratio: 9 / 16; max-height: 72vh; margin: 0 auto; }
    .player iframe { display: block; width: 100%; height: 100%; border: 0; }

    .modal-body { padding: 16px 20px 20px; }
    .modal-body h2 { font-size: 18px; margin: 0 0 4px; }
    .modal-body .meta { font-size: 13px; color: var(--muted); }
    .modal-body .desc { white-space: pre-wrap; font-size: 14.5px; margin: 12px 0 0; }
    .modal-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .modal-links a { text-decoration: none; }

    /* 닫기 버튼 줄: 영상 위쪽 바깥에 두어 유튜브 화면(제목 등)을 가리지 않음.
       긴 설명을 스크롤해도 보이도록 창 위쪽에 고정 */
    .modal-bar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      justify-content: flex-end;
      padding: 8px 10px;
      background: var(--modal);
      border-bottom: 1px solid var(--line);
    }

    .close {
      font: inherit;
      font-size: 14px;
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--fg);
      cursor: pointer;
    }

    .close:hover, .close:focus-visible { border-color: var(--accent); color: var(--accent); }

    a { color: var(--accent); }

    @media (max-width: 600px) {
      h1 { font-size: 23px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
      .card h2 { font-size: 13.5px; }
      .toolbar input { width: 100%; }
      .modal { padding: 0; align-items: stretch; }
      .modal-panel { max-height: 100vh; border-radius: 0; border: 0; }
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="./" class="back">← Discography로 돌아가기</a>

    <header>
      <h1>Videos</h1>
      <p class="subtitle">앨범곡 · 미발매곡 · Shorts — rebroni의 영상 모음<br>
        <span style="font-size:13px;">Music videos, visualizers and shorts from the studio.</span></p>
    </header>

    <div class="toolbar" id="toolbar" hidden>
      <button class="chip on" type="button" data-kind="">전체</button>
      <button class="chip" type="button" data-kind="album">앨범곡</button>
      <button class="chip" type="button" data-kind="unreleased">미발매곡</button>
      <button class="chip" type="button" data-kind="etc">기타</button>
      <button class="chip" type="button" data-kind="shorts">Shorts</button>
      <span class="spacer"></span>
      <select id="album-filter" aria-label="앨범으로 거르기"><option value="">모든 앨범</option></select>
      <input type="search" id="search" placeholder="영상 검색…" aria-label="영상 검색">
    </div>

    <main class="grid" id="videos">
      <p class="empty" style="grid-column:1/-1;">불러오는 중…</p>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-panel" id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-bar">
        <button class="close" id="modal-close" type="button" aria-label="닫기">닫기 ✕</button>
      </div>
      <div class="player" id="player"></div>
      <div class="modal-body">
        <h2 id="modal-title"></h2>
        <div class="meta" id="modal-meta"></div>
        <p class="desc" id="modal-desc"></p>
        <div class="modal-links" id="modal-links"></div>
      </div>
    </div>
  </div>

  <script type="module" src="videos.js?v=2"></script>
</body>

</html>
